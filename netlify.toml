# Netlify config at the GitHub repo root (app lives under chess-repertoire/).

[build]
  command = "cd chess-repertoire/webapp/frontend && npm ci && npm run build"
  publish = "chess-repertoire/webapp/static"

[[redirects]]
  from = "/api/*"
  to = "https://chess-repertoire-bteo.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
