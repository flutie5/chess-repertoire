# Netlify — Vite build + API proxy (same-origin cookies for auth)
#
# Use with Base directory = "chess-repertoire" in the Netlify UI,
# OR rely on the repo-root netlify.toml instead.

[build]
  command = "cd webapp/frontend && npm ci && npm run build"
  publish = "webapp/static"

[[redirects]]
  from = "/api/*"
  to = "https://chess-repertoire-bteo.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
