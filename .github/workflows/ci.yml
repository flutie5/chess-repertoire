name: CI

on:
  push:
    branches: [master, main, "cursor/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-repertoire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt pytest
      - name: Pytest
        run: python -m pytest tests/ -q
      - name: Alembic (empty DB)
        run: |
          export DATA_DIR="$RUNNER_TEMP/oe-data"
          mkdir -p "$DATA_DIR"
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chess-repertoire/webapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chess-repertoire/webapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
